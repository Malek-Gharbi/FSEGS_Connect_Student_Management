name: fsegs_connect
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (versions compatibles Dart 3.9)
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5

  # Utilitaires
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3

  # SQLite (optionnel)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^10.3.8
  open_file: ^3.3.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  universal_io: ^2.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
